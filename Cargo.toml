[package]
name = "tcops"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
good_lp = { version = "1.14", features = ["lp-solvers","scip"], default-features = false, optional = true }
scip-sys = { version = "0.1", features = ["bundled"], optional = true }
grb = { version = "3.0", features = ['gurobi12']}
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.26"

[features]
default = []
lib_good_lp = ["dep:good_lp", "dep:scip-sys"]
